name: Add Bookmark from Issue

on:
  issues:
    types: [opened]

jobs:
  add-bookmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse issue and update README
        shell: bash
        run: |
          set -euo pipefail

          TITLE="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"

          if [[ ! "$TITLE" =~ ^\[([^][]+)\][[:space:]]*(.+)[[:space:]]\|[[:space:]]*(https?://[^[:space:]]+)$ ]]; then
            echo "Issue 标题格式不正确：$TITLE"
            exit 1
          fi

          CATEGORY="${BASH_REMATCH[1]}"
          NAME="${BASH_REMATCH[2]}"
          URL="${BASH_REMATCH[3]}"

          if [ ! -f README.md ]; then
            printf '# bookmarks\n\n' > README.md
          fi

          if ! grep -Fqx "## $CATEGORY" README.md; then
            printf '\n## %s\n- [%s](%s)\n' "$CATEGORY" "$NAME" "$URL" >> README.md
          else
            awk -v category="## $CATEGORY" -v link="- [$NAME]($URL)" '
              { print }
              $0 == category { print link }
            ' README.md > README.tmp
            mv README.tmp README.md
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "bookmark-bot"
          git config user.email "actions@github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README.md has no changes."
            exit 0
          fi

          git commit -m "Add bookmark from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "✅ 已自动添加到 README.md"
